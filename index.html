<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل المستندات الذكية - SaaS Enterprise</title>
    <!-- استدعاء خط عالي الجودة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.88);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(31, 41, 55, 0.8);
            --success: #10b981;
            --error: #ef4444;
            --pro-gold: #f59e0b;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.85)), 
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* الشعار أو الأيقونة الاحترافية العصرية بدلاً من المكعب الصغير */
        .brand-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 20px;
            font-size: 36px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); transform: scale(1.05); }
        }

        /* العنوان الرئيسي خارج الصندوق في أعلى الصفحة */
        .main-header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .main-header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .main-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: rgba(11, 15, 25, 0.7);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .forgot-link {
            display: block;
            text-align: left;
            font-size: 12px;
            color: var(--accent-color);
            text-decoration: none;
            margin-top: 6px;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .file-drop-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            background-color: rgba(11, 15, 25, 0.4);
        }

        .file-drop-area:hover {
            background-color: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-color);
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-upgrade {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .btn-upgrade:hover {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        #statusMessage, #registerMessage, #loginMessage, #resetMessage, #upgradeMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }

        .key-box {
            background-color: rgba(11, 15, 25, 0.9);
            border: 1px solid var(--success);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            word-break: break-all;
            font-family: monospace;
            color: var(--success);
            font-size: 13px;
            text-align: center;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 10px;
            padding: 0;
        }

        .dashboard-widget {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-top: 15px;
            display: none;
            font-size: 12px;
        }

        .dashboard-widget.active {
            display: block;
        }

        .dash-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #374151;
            border-radius: 4px;
            height: 6px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- الشعار الاحترافي المتطور في أعلى الصفحة -->
    <div class="main-header">
        <div class="brand-badge">
            ⚡
        </div>
        <h1>منصة تحويل المستندات</h1>
        <p>النظام الاحترافي لاستخراج الجداول من PDF إلى Excel</p>
    </div>

    <div class="main-container">
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('convertTab', this)">تحويل الملفات</button>
            <button class="tab-btn" onclick="switchTab('registerTab', this)">حساب جديد 🔑</button>
            <button class="tab-btn" onclick="switchTab('loginTab', this)">تسجيل الدخول 👤</button>
            <button class="tab-btn" onclick="switchTab('upgradeTab', this)" style="color: var(--pro-gold);">ترقية Pro 💎</button>
        </div>

        <!-- 1. قسم التحويل -->
        <div id="convertTab" class="form-section active">
            <div class="input-group">
                <label for="apiKey">مفتاح الاشتراك (API Key):</label>
                <input type="text" id="apiKey" placeholder="ألصق مفتاح الـ API أو سجّل الدخول">
            </div>

            <div id="userDashboard" class="dashboard-widget">
                <div class="dash-row">
                    <span>الباقة الحالية: <strong id="dashPlan" style="color: var(--success);">Free</strong></span>
                    <span>التحويلات: <strong id="dashUsage">0</strong> / <span id="dashLimit">3</span></span>
                </div>
                <div style="color: var(--text-muted); margin-bottom: 2px;">سعة الاستهلاك المجاني:</div>
                <div class="progress-bar-container">
                    <div id="dashProgressBar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 15px;">
                <label>اختر ملف الـ PDF:</label>
                <div class="file-drop-area" onclick="document.getElementById('pdfFile').click()">
                    <span id="fileNameDisplay">اضغط لاختيار ملف PDF</span>
                    <input type="file" id="pdfFile" accept=".pdf" style="display: none;" onchange="updateFileName()">
                </div>
            </div>

            <button class="btn-submit" onclick="convertFile()">تحويل إلى Excel الآن 🚀</button>
            <div id="statusMessage"></div>
        </div>

        <!-- 2. قسم تسجيل الحساب -->
        <div id="registerTab" class="form-section">
            <div class="input-group">
                <label for="regEmail">البريد الإلكتروني:</label>
                <input type="email" id="regEmail" placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label for="regPassword">كلمة المرور:</label>
                <input type="password" id="regPassword" placeholder="********">
                <a class="forgot-link" onclick="openResetSection()">نسيت كلمة المرور؟</a>
            </div>
            <button class="btn-submit" onclick="registerUser()">الحصول على مفتاح API مجاني 🎁</button>
            <div id="registerMessage"></div>
        </div>

        <!-- 3. قسم تسجيل الدخول -->
        <div id="loginTab" class="form-section">
            <div class="input-group">
                <label for="logEmail">البريد الإلكتروني:</label>
                <input type="email" id="logEmail" placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label for="logPassword">كلمة المرور:</label>
                <input type="password" id="logPassword" placeholder="********">
                <a class="forgot-link" onclick="openResetSection()">نسيت كلمة المرور؟</a>
            </div>
            <button class="btn-submit" onclick="loginUser()">استرجاع مفتاح API الخاص بي 🔓</button>
            <div id="loginMessage"></div>
        </div>

        <!-- 4. قسم استعادة كلمة السر -->
        <div id="resetTab" class="form-section">
            <button class="back-btn" onclick="closeResetSection()">➡️ العودة</button>
            <div class="input-group">
                <label for="resetEmail">البريد الإلكتروني المسجل:</label>
                <input type="email" id="resetEmail" placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label for="resetPassword">كلمة المرور الجديدة:</label>
                <input type="password" id="resetPassword" placeholder="كلمة سر جديدة">
            </div>
            <button class="btn-submit" onclick="resetPassword()">تحديث كلمة المرور 🔐</button>
            <div id="resetMessage"></div>
        </div>

        <!-- 5. قسم ترقية الحساب إلى Pro -->
        <div id="upgradeTab" class="form-section">
            <div style="text-align: center; margin-bottom: 15px;">
                <span style="background: rgba(245, 158, 11, 0.1); color: var(--pro-gold); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">الباقة الاحترافية Pro</span>
                <p style="color: var(--text-muted); font-size: 12px; margin-top: 8px;">استمتع بتحويلات غير محدودة بدون قيود!</p>
            </div>

            <div class="input-group">
                <label for="upEmail">البريد الإلكتروني لحسابك (للتوثيق):</label>
                <input type="email" id="upEmail" placeholder="name@example.com">
            </div>

            <button class="btn-submit btn-upgrade" onclick="upgradeAccount()">تفعيل الاشتراك المدفوع 💎</button>
            <div id="upgradeMessage"></div>
        </div>

    </div>

    <script>
        let currentUserData = { plan: 'free', used: 0 };
        const API_BASE = "http://127.0.0.1:8000";

        function switchTab(tabId, btn) {
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        function openResetSection() {
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('resetTab').classList.add('active');
        }

        function closeResetSection() {
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById('registerTab').classList.add('active');
        }

        function updateFileName() {
            const fileInput = document.getElementById('pdfFile');
            const display = document.getElementById('fileNameDisplay');
            if (fileInput.files.length > 0) {
                display.innerText = "📄 " + fileInput.files[0].name;
                display.style.color = "#10b981";
            }
        }

        function updateDashboardUI(plan, used) {
            currentUserData.plan = plan;
            currentUserData.used = used;
            
            const widget = document.getElementById('userDashboard');
            widget.classList.add('active');

            const planEl = document.getElementById('dashPlan');
            const usageEl = document.getElementById('dashUsage');
            const limitEl = document.getElementById('dashLimit');
            const fillBar = document.getElementById('dashProgressBar');

            planEl.innerText = plan.toUpperCase();
            usageEl.innerText = used;

            if (plan === 'pro') {
                planEl.style.color = 'var(--pro-gold)';
                limitEl.innerText = 'غير محدود ♾️';
                fillBar.style.width = '100%';
                fillBar.style.backgroundColor = 'var(--pro-gold)';
            } else {
                planEl.style.color = 'var(--success)';
                limitEl.innerText = '3';
                let percent = (used / 3) * 100;
                if (percent > 100) percent = 100;
                fillBar.style.width = percent + '%';
                fillBar.style.backgroundColor = used >= 3 ? 'var(--error)' : 'var(--success)';
            }
        }

        async function registerUser() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const msgDiv = document.getElementById('registerMessage');

            if (!email || !password) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'المرجو إدخال البريد الإلكتروني وكلمة المرور!';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'خطأ في التسجيل.');

                msgDiv.innerHTML = `
                    <div style="color: var(--success); margin-bottom: 5px;">تم إنشاء الحساب بنجاح! مفتاحك:</div>
                    <div class="key-box">${data.api_key}</div>
                `;
                document.getElementById('apiKey').value = data.api_key;
                updateDashboardUI(data.plan, data.conversions_used);
            } catch (error) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'خطأ: ' + error.message;
            }
        }

        async function loginUser() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPassword').value.trim();
            const msgDiv = document.getElementById('loginMessage');

            if (!email || !password) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'المرجو إدخال الإيميل والباسورد!';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'معلومات الدخول غير صحيحة.');

                msgDiv.innerHTML = `
                    <div style="color: var(--success); margin-bottom: 5px;">مرحباً بك! مفتاحك:</div>
                    <div class="key-box">${data.api_key}</div>
                `;
                document.getElementById('apiKey').value = data.api_key;
                updateDashboardUI(data.plan, data.conversions_used);
            } catch (error) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'خطأ: ' + error.message;
            }
        }

        async function resetPassword() {
            const email = document.getElementById('resetEmail').value.trim();
            const new_password = document.getElementById('resetPassword').value.trim();
            const msgDiv = document.getElementById('resetMessage');

            try {
                const response = await fetch(`${API_BASE}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail);
                msgDiv.style.color = 'var(--success)';
                msgDiv.innerText = data.message;
            } catch (error) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'خطأ: ' + error.message;
            }
        }

        function upgradeAccount() {
            const email = document.getElementById('upEmail').value.trim();
            const msgDiv = document.getElementById('upgradeMessage');

            if (!email) {
                msgDiv.style.color = 'var(--error)';
                msgDiv.innerText = 'المرجو إدخال الإيميل أولاً!';
                return;
            }

            const paymentCheckoutURL = `https://your-store.lemonsqueezy.com/buy/product-id?checkout[custom][email]=${encodeURIComponent(email)}`;
            
            msgDiv.style.color = 'var(--pro-gold)';
            msgDiv.innerText = 'جاري توجيهك لصفحة الدفع الآمنة... 💳';
            
            setTimeout(() => {
                window.location.href = paymentCheckoutURL;
            }, 1500);
        }

        async function convertFile() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('statusMessage');

            if (!apiKey) {
                statusDiv.style.color = 'var(--error)';
                statusDiv.innerText = 'أدخل مفتاح API أولاً!';
                return;
            }

            if (fileInput.files.length === 0) {
                statusDiv.style.color = 'var(--error)';
                statusDiv.innerText = 'اختر ملف PDF للتحويل!';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            statusDiv.style.color = '#6366f1';
            statusDiv.innerText = 'جاري استخراج البيانات... ⏳';

            try {
                const response = await fetch(`${API_BASE}/convert`, {
                    method: 'POST',
                    headers: { 'x-api-key': apiKey },
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'حدث خطأ.');
                }

                const newUsed = response.headers.get("X-Conversions-Used");
                if (newUsed !== null) {
                    updateDashboardUI(currentUserData.plan, parseInt(newUsed));
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Converted_Table.xlsx';
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusDiv.style.color = 'var(--success)';
                statusDiv.innerText = 'تم التحويل والتحميل بنجاح! 🎉';
            } catch (error) {
                statusDiv.style.color = 'var(--error)';
                statusDiv.innerText = 'خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>
